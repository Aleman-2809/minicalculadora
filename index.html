<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EX2 - Mini Calculadora Segura</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Mini Calculadora Segura</h1>

    <form id="calcForm">
      <input type="number" id="num1" placeholder="Número 1" step="any" required />

      <select id="operation">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>

      <input type="number" id="num2" placeholder="Número 2" step="any" required />

      <button type="submit">Calcular</button>
    </form>

    <p id="result"></p>

    <h2>Historial</h2>
    <ul id="historyList"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
